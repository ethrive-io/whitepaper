name: release-please

# Release management for the whole ecosystem is release-please (ADR pending).
#
# HOW A RELEASE HAPPENS NOW. You do not tag by hand any more. Land conventional
# commits on `main`; release-please keeps ONE open "chore(main): release X.Y.Z"
# pull request whose body is the changelog it has accumulated. Merging that PR
# is the release: it writes CHANGELOG.md, bumps `version.txt`, creates the
# `vX.Y.Z` tag and publishes the GitHub Release.
#
# WHY THE EXISTING release.yml STILL EXISTS. It triggers on a `vX.Y.Z` tag push,
# which is exactly what merging the release PR produces. So the two compose:
# release-please decides WHEN and WHAT VERSION, the existing workflow builds and
# attaches the artefacts. Neither one had to be deleted for the other to work.
#
# THE VERSION IS THE TAG. No SDK publishes to a language registry (npm, crates,
# pub, PyPI, Maven) — release artefacts go to GitHub Releases only — so a
# version field inside pubspec.yaml / Cargo.toml / package.json is decorative.
# That is why every repo in this ecosystem uses the `simple` release-type and
# tracks its version in `version.txt`, rather than each one needing a different
# language-specific strategy.
#
# DCO. Every commit in this org must carry `Signed-off-by` and a reusable
# workflow enforces it on pull requests. A bot-authored release PR is still a
# pull request, so `signoff` is set in release-please-config.json — without it
# every release PR would be blocked by the DCO gate.
#
# ── THE PRE-v1 POLICY (two flags in release-please-config.json) ──────────────
#
#   "bump-minor-pre-major": true
#       While the major is 0, a BREAKING change (`feat!:` or a `BREAKING
#       CHANGE:` footer) bumps the MINOR, not the major. 0.1.0 -> 0.2.0, never
#       -> 1.0.0. This is the "we are pre-v1" switch: it makes it impossible to
#       reach 1.0.0 by accident, which matters here because invariant #9 makes
#       breaking changes ROUTINE — the wire is `1.0.0-draft.N`, there are no
#       users, and we delete rather than deprecate. Without this flag the first
#       `feat!:` would silently ship 1.0.0 and make wire additivity load-bearing.
#
#   "bump-patch-for-minor-pre-major": true
#       While the major is 0, a plain `feat:` bumps the PATCH, not the minor.
#       Combined with the flag above the pre-v1 ladder reads:
#           fix:    -> patch   (0.1.0 -> 0.1.1)
#           feat:   -> patch   (0.1.0 -> 0.1.1)
#           feat!:  -> minor   (0.1.0 -> 0.2.0)
#       So the minor digit means exactly one thing before v1: SOMETHING BROKE.
#       That is the signal worth having in a corpus where breakage is expected
#       and features are constant.
#
#   CUTTING v1.0.0 is therefore a deliberate act, not a drift: set both flags to
#   false (or `release-as: "1.0.0"` once). That is the same explicit decision
#   the workspace CLAUDE.md already describes as flipping invariant #9.
#
# ── BOOTSTRAP: `release-as` IS TEMPORARY ────────────────────────────────────
#
# `release-as: "0.1.0"` in the config forces the FIRST release to be exactly
# v0.1.0 rather than the 0.0.1 the commit history would otherwise compute.
# It is STICKY — left in place it pins EVERY future release to 0.1.0. REMOVE IT
# from release-please-config.json immediately after v0.1.0 is published.

# ── THE `next` PRERELEASE LANE ──────────────────────────────────────────────
#
# `main` is the TRUNK: work lands there and STABLE releases are cut there.
# `next` is a permanent DOWNSTREAM PREVIEW lane. It only ever RECEIVES merges
# from main (this repo's own `bash scripts/prerelease-sync.sh`) and it
# cuts RELEASE CANDIDATES — v0.1.0-rc1, v0.1.0-rc2. It never merges back, so
# the two branches are never meant to converge and their manifests are SUPPOSED
# to diverge. Do not "tidy up" `next` by resetting it to main.
#
# THIS FILE MUST EXIST ON BOTH BRANCHES, because a workflow only ever runs from
# the branch it is on. It is IDENTICAL on both. The one file that intentionally
# differs is release-please-config.json: `next`'s copy adds
#
#     "versioning": "prerelease"     the version arithmetic (rc1 -> rc2)
#     "prerelease": true             keep the suffix; flag the GitHub Release
#     "prerelease-type": "rc"        the suffix to use when the base has none
#
# release-please reads its config, its manifest and its changelog FROM THE
# BRANCH IT TARGETS, which is what lets this one workflow drive two release
# lines. `"prerelease": true` ALONE is not enough — without `versioning` the
# numbers `next` computes are byte-identical to main's, so it would publish a
# STABLE tag off the preview branch with nothing anywhere going red.
#
# NEVER REBASE `next`. Its RC tags are what release-please anchors the version
# arithmetic on; rewriting its SHAs strands them and the following RC is
# computed from the wrong base. Merge only, and never force-push (invariant #5).

on:
  push:
    branches:
      - main
      # The prerelease preview lane. Same workflow, different target branch —
      # see "THE `next` PRERELEASE LANE" above.
      - next
  # Manual trigger. release-please recomputes the release from the whole commit
  # history on every run, so firing this by hand is always safe and idempotent —
  # it updates the open release PR rather than creating a second one. Needed
  # because a push is otherwise the ONLY trigger, so regenerating a PR (e.g.
  # after a config change that only takes effect at PR-creation time, like
  # pull-request-title-pattern) would otherwise require a dummy commit.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# A second push while a release PR is being reconciled would race it.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # WITHOUT THIS, A RUN ON `next` WOULD RELEASE `main`. The action's
          # `target-branch` input defaults to the repository's DEFAULT branch —
          # not the branch the workflow happens to be running on — so leaving it
          # unset makes a push to `next` open a release PR against main, from
          # main's history. `github.ref_name` is the triggering branch for both
          # the `push` and the `workflow_dispatch` trigger.
          target-branch: ${{ github.ref_name }}
